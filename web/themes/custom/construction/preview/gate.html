<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview: the gate (login)</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/gate.css">
</head>
<body>
<!-- Static preview of page--gate.html.twig with Drupal's core login form markup. -->
<div class="gate">
  <div class="hazard-stripe" aria-hidden="true"></div>
  <main id="main-content" class="container gate__main" role="main">
    <section class="gate__zone">
      <div class="gate__sign" aria-hidden="true"><div class="gate__diamond"><div class="gate__diamond-inner">
        <svg class="hard-hat" width="72" height="72" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 35h38"/><path d="M9 35v-5a15 15 0 0 1 30 0v5"/><path d="M19 16.5V12h10v4.5"/><path d="M24 12v11"/></svg>
        <span class="gate__diamond-text">Work<br>zone</span></div></div></div>
      <p class="gate__name">I Shop on Amazon Way Too Much</p>
      <p class="gate__lede">Site under construction. Crew and owner only past this point.</p>
    </section>
    <section class="gate__box"><div class="gate__box-inner">
      <h1>Log in</h1>
      <nav><ul class="tabs"><li><a class="is-active" href="#">Log in</a></li><li><a href="#">Reset your password</a></li></ul></nav>
      <form class="user-login-form" id="user-login-form">
        <div class="js-form-item form-item form-type-textfield form-item-name"><label for="edit-name" class="js-form-required form-required">Username</label><input autocorrect="none" autocapitalize="none" spellcheck="false" autocomplete="username" type="text" id="edit-name" name="name" size="60" maxlength="60" class="form-text required"></div>
        <div class="js-form-item form-item form-type-password form-item-pass"><label for="edit-pass" class="js-form-required form-required">Password</label><input autocomplete="current-password" type="password" id="edit-pass" name="pass" size="60" maxlength="128" class="form-text required"></div>
        <div class="form-actions js-form-wrapper form-wrapper" id="edit-actions"><input type="submit" id="edit-submit" name="op" value="Log in" class="button js-form-submit form-submit"></div>
      </form>
    </div></section>
  </main>
  <div class="container gate__barricade" aria-hidden="true"><div class="gate__rail"></div><div class="gate__legs"><span></span><span></span></div></div>
  <p class="container gate__note">Building something for Cody. Check back soon.</p>
</div>
</body>
</html>
