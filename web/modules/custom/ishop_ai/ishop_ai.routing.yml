ishop_ai.setup:
  path: '/site-office/ai-setup'
  defaults:
    _form: '\Drupal\ishop_ai\Form\AiSetupForm'
    _title: 'AI setup'
  requirements:
    _custom_access: '\Drupal\ishop_ai\Form\AiSetupForm::access'
  options:
    no_cache: TRUE

ishop_ai.write_listing:
  path: '/item/{node}/write-listing'
  defaults:
    _controller: '\Drupal\ishop_ai\Controller\WriteListingController::queue'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'node.update'
    _csrf_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
        bundle: [item]
