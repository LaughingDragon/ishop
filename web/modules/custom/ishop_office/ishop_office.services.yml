services:
  _defaults:
    autowire: true
  Drupal\ishop_office\OfficeManager: ~
  ishop_office.manager:
    alias: Drupal\ishop_office\OfficeManager
  ishop_office.theme_negotiator:
    class: Drupal\ishop_office\Theme\OfficeThemeNegotiator
    tags:
      - { name: theme_negotiator, priority: 10 }
  Drupal\ishop_office\EventSubscriber\CrewOnlySubscriber:
    tags:
      - { name: event_subscriber }
