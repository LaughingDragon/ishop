ishop_items.add:
  path: '/add'
  defaults:
    _form: '\Drupal\ishop_items\Form\AddItemForm'
    _title: 'Add item'
  requirements:
    _entity_create_access: 'node:item'
  options:
    no_cache: TRUE

ishop_items.add_photo:
  path: '/add/photo'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\AddController::uploadPhoto'
  methods: [POST]
  requirements:
    _entity_create_access: 'node:item'
    _csrf_request_header_token: 'TRUE'

ishop_items.manifest:
  path: '/manifest.webmanifest'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\AddController::manifest'
  methods: [GET]
  requirements:
    _access: 'TRUE'

ishop_items.post_start:
  path: '/item/{node}/post'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\PostController::start'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'node.view'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
        bundle: [item]

ishop_items.post:
  path: '/item/{node}/post/{platform}'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\PostController::page'
    _title_callback: '\Drupal\ishop_items\Controller\PostController::title'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'node.view'
    node: \d+
    platform: '[a-z]+'
  options:
    no_cache: TRUE
    parameters:
      node:
        type: entity:node
        bundle: [item]

ishop_items.post_zip:
  path: '/item/{node}/post/{platform}/photos.zip'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\PostController::zip'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'node.view'
    node: \d+
    platform: '[a-z]+'
  options:
    no_cache: TRUE
    parameters:
      node:
        type: entity:node
        bundle: [item]

ishop_items.depop_bulk:
  path: '/post/depop-bulk'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\DepopBulkController::page'
    _title: 'Depop bulk upload'
  requirements:
    _permission: 'manage platform listings'
  options:
    no_cache: TRUE

ishop_items.depop_bulk_csv:
  path: '/post/depop-bulk/depop-bulk.csv'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\DepopBulkController::csv'
  requirements:
    _permission: 'manage platform listings'
  options:
    no_cache: TRUE

ishop_items.depop_bulk_photos:
  path: '/post/depop-bulk/photos.zip'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\DepopBulkController::photos'
  requirements:
    _permission: 'manage platform listings'
  options:
    no_cache: TRUE

ishop_items.stale:
  path: '/post/stale'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\StaleController::page'
    _title: 'Stale listings'
  requirements:
    _permission: 'manage platform listings'
  options:
    no_cache: TRUE

ishop_items.stale_answer:
  path: '/post/stale/{platform_listing}/{answer}'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\StaleController::answer'
  requirements:
    _permission: 'manage platform listings'
    _csrf_token: 'TRUE'
    answer: 'done|snooze|keep'
  options:
    parameters:
      platform_listing:
        type: entity:platform_listing

ishop_items.tax_export:
  path: '/room/my-office/tax/{year}/{kind}'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\TaxExportController::download'
  requirements:
    _permission: 'manage platform listings'
    _user_is_logged_in: 'TRUE'
    year: '\d{4}'
    kind: 'sales|donations'
  options:
    no_cache: TRUE

ishop_items.bulk_add:
  path: '/add/bulk'
  defaults:
    _form: '\Drupal\ishop_items\Form\BulkAddForm'
    _title: 'Bulk photo drop'
  requirements:
    _entity_create_access: 'node:item'
  options:
    no_cache: TRUE

ishop_items.shipping_room:
  path: '/room/shipping-room'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\ShippingController::page'
    _title: 'Shipping room'
  requirements:
    _permission: 'manage platform listings'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

ishop_items.shipping_shipped:
  path: '/room/shipping-room/{platform_listing}/shipped'
  defaults:
    _form: '\Drupal\ishop_items\Form\ShippedForm'
    _title_callback: '\Drupal\ishop_items\Form\ShippedForm::title'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'platform_listing.update'
    platform_listing: \d+
  options:
    no_cache: TRUE
    parameters:
      platform_listing:
        type: entity:platform_listing

ishop_items.shipping_label:
  path: '/room/shipping-room/{platform_listing}/label'
  defaults:
    _form: '\Drupal\ishop_items\Form\ShippingLabelForm'
    _title_callback: '\Drupal\ishop_items\Form\ShippingLabelForm::title'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'platform_listing.update'
    platform_listing: \d+
  options:
    no_cache: TRUE
    parameters:
      platform_listing:
        type: entity:platform_listing

ishop_items.shipping_act:
  path: '/room/shipping-room/{platform_listing}/{action}'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\ShippingController::act'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'platform_listing.update'
    _csrf_token: 'TRUE'
    platform_listing: \d+
    action: 'delivered|undo-shipped|undo-delivered'
  options:
    no_cache: TRUE
    parameters:
      platform_listing:
        type: entity:platform_listing

ishop_items.import_listings:
  path: '/room/my-office/import-listings'
  defaults:
    _form: '\Drupal\ishop_items\Form\ListingImportForm'
    _title: 'Import listings'
  requirements:
    _permission: 'import listings'
  options:
    no_cache: TRUE

ishop_items.import_listings_undo:
  path: '/room/my-office/import-listings/{import}/undo'
  defaults:
    _form: '\Drupal\ishop_items\Form\ListingImportUndoForm'
    _title: 'Undo an import'
  requirements:
    _permission: 'import listings'
    import: \d+
  options:
    no_cache: TRUE

ishop_items.sheet_notes:
  path: '/room/stockroom/sheet-notes'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\SheetNotesController::page'
    _title: 'Notes from your spreadsheet'
  requirements:
    _permission: 'manage platform listings'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

ishop_items.sheet_note_done:
  path: '/room/stockroom/sheet-notes/{node}/done'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\SheetNotesController::done'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'node.view'
    _csrf_token: 'TRUE'
    node: \d+
  options:
    no_cache: TRUE
    parameters:
      node:
        type: entity:node
        bundle: [item]
