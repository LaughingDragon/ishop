ishop_items.returns:
  type: config_object
  label: 'Return windows'
  mapping:
    days:
      type: integer
      label: 'Days from the order date'
    holiday:
      type: boolean
      label: 'Use the holiday returns rule'
    holiday_from:
      type: string
      label: 'Holiday orders from (MM-DD)'
    holiday_to:
      type: string
      label: 'Holiday orders to (MM-DD)'
    holiday_until:
      type: string
      label: 'Holiday orders returnable until (MM-DD)'
