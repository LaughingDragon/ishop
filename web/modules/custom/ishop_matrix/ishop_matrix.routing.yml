ishop_matrix.dashboard:
  path: '/reseller-matrix'
  defaults:
    _controller: '\Drupal\ishop_matrix\Controller\MatrixController::dashboard'
    _title: 'Reseller Matrix'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

ishop_matrix.stockroom:
  path: '/room/stockroom'
  defaults:
    _controller: '\Drupal\ishop_items\Controller\StockroomController::page'
    _title: 'Stockroom'
  requirements:
    _permission: 'manage platform listings'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

ishop_matrix.my_office:
  path: '/room/my-office'
  defaults:
    _controller: '\Drupal\ishop_matrix\Controller\MatrixController::myOffice'
    _title: 'My office'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

ishop_matrix.room:
  path: '/room/{room}'
  defaults:
    _controller: '\Drupal\ishop_matrix\Controller\MatrixController::room'
    _title_callback: '\Drupal\ishop_matrix\Controller\MatrixController::roomTitle'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
    room: '[a-z-]+'

# TEMPORARY (birthday mode): see TEMPORARY.md.
ishop_matrix.birthday_settings:
  path: '/site-office/birthday'
  defaults:
    _form: '\Drupal\ishop_matrix\Form\BirthdayForm'
    _title: 'Birthday mode'
  requirements:
    _custom_access: '\Drupal\ishop_matrix\Form\BirthdayForm::access'
  options:
    no_cache: TRUE

ishop_matrix.birthday_song:
  path: '/birthday/song.mp3'
  defaults:
    _controller: '\Drupal\ishop_matrix\Controller\BirthdayController::song'
  methods: [GET, HEAD]
  requirements:
    _custom_access: '\Drupal\ishop_matrix\Controller\BirthdayController::access'
  options:
    no_cache: TRUE

ishop_matrix.calendar:
  path: '/room/calendar-wall'
  defaults:
    _controller: '\Drupal\ishop_matrix\Controller\CalendarController::page'
    _title: 'Calendar wall'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE
