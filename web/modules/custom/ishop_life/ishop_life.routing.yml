ishop_life.log:
  path: '/room/my-office/log'
  defaults:
    _controller: '\Drupal\ishop_life\Controller\LogController::page'
    _title: 'Mileage and expenses'
  requirements:
    _permission: 'manage platform listings'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

ishop_life.tax_export:
  path: '/room/my-office/tax/{year}/{kind}'
  defaults:
    _controller: '\Drupal\ishop_life\Controller\LogController::export'
  requirements:
    _permission: 'manage platform listings'
    _user_is_logged_in: 'TRUE'
    year: '\d{4}'
    kind: 'mileage|expenses'
  options:
    no_cache: TRUE

ishop_life.bills:
  path: '/room/my-office/bills'
  defaults:
    _controller: '\Drupal\ishop_life\Controller\BillsController::page'
    _title: 'Bills and subscriptions'
  requirements:
    _permission: 'manage platform listings'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

ishop_life.bill_paid:
  path: '/room/my-office/bills/{node}/paid'
  defaults:
    _controller: '\Drupal\ishop_life\Controller\BillsController::paid'
  requirements:
    _permission: 'manage platform listings'
    _entity_access: 'node.update'
    _csrf_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
        bundle: [bill]

ishop_life.break_room:
  path: '/room/break-room'
  defaults:
    _controller: '\Drupal\ishop_life\Controller\BreakRoomController::page'
    _title: 'Break room'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

ishop_life.todo_toggle:
  path: '/room/break-room/todo/{node}/{action}'
  defaults:
    _controller: '\Drupal\ishop_life\Controller\BreakRoomController::toggle'
  requirements:
    _entity_access: 'node.update'
    _csrf_token: 'TRUE'
    node: \d+
    action: 'done|undo'
  options:
    parameters:
      node:
        type: entity:node
        bundle: [todo]

ishop_life.mailroom:
  path: '/room/mailroom'
  defaults:
    _controller: '\Drupal\ishop_life\Controller\MailroomController::page'
    _title: 'Mailroom'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE
