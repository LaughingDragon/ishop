_core:
  default_config_hash: JyIkFj38h-aTLsrCfejAfP277qBJ61tlaLEBH44IHhg
langcode: en
enabled: true
required_roles: {  }
send_plugins: {  }
login_plugins:
  tfa_trusted_browser: tfa_trusted_browser
login_plugin_settings:
  tfa_trusted_browser:
    cookie_allow_subdomains: false
    cookie_expiration: 30
    cookie_name: tfa-trusted-browser
allowed_validation_plugins:
  tfa_totp: tfa_totp
  tfa_recovery_code: tfa_recovery_code
default_validation_plugin: tfa_totp
validation_plugin_settings:
  tfa_totp:
    time_skew: 2
    site_name_prefix: 0
    name_prefix: ishop
    issuer: 'I Shop on Amazon Way Too Much'
  tfa_recovery_code:
    recovery_codes_amount: 10
validation_skip: 3
users_without_tfa_redirect: true
reset_pass_skip_enabled: false
encryption: tfa
tfa_flood_uid_only: 1
tfa_flood_window: 300
tfa_flood_threshold: 6
help_text: 'Contact support to reset your access'
mail:
  tfa_enabled_configuration:
    subject: 'Your [site:name] account now has two-factor authentication'
    body: |-
      [user:display-name],

      Thanks for configuring two-factor authentication on your [site:name] account!

      This additional level of security will help to ensure that only you are able to log in to your account.

      If you ever lose the device you configured, you should act quickly to delete its association with this account.

      --
      [site:name] team
  tfa_disabled_configuration:
    subject: 'Your [site:name] account no longer has two-factor authentication'
    body: |-
      [user:display-name],

      Two-factor authentication has been disabled on your [site:name] account.

      If you did not take this action, please contact a site administrator immediately.

      --
      [site:name] team